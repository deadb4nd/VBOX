<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780" role="img" aria-label="VeloBox firmware architecture: phone browser, JSON API, execution core, radio and IO">
  <defs>
    <linearGradient id="agbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c11"/>
      <stop offset="1" stop-color="#060709"/>
    </linearGradient>
    <marker id="aup" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M1 8 L5 2 L9 8" fill="none" stroke="#7c8cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="adn" markerWidth="10" markerHeight="10" refX="5" refY="2" orient="auto">
      <path d="M1 2 L5 8 L9 2" fill="none" stroke="#7c8cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1400" height="780" rx="24" fill="url(#agbg)"/>
  <rect x="1" y="1" width="1398" height="778" rx="23" fill="none" stroke="#1c212b"/>

  <text x="60" y="66" fill="#e9ecf3" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="700">How it fits together</text>
  <text x="60" y="98" fill="#8a93a4" font-family="'Segoe UI',Arial,sans-serif" font-size="18">Flat by design. The pure pieces are host-tested with no hardware attached.</text>

  <!-- layer 1: browser -->
  <g transform="translate(120,120)">
    <rect width="1160" height="96" rx="16" fill="#0d0f14" stroke="#2b3240"/>
    <rect x="0" y="0" width="4" height="96" rx="2" fill="#7c8cff"/>
    <text x="28" y="42" fill="#e9ecf3" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700">Phone browser</text>
    <text x="28" y="70" fill="#8a93a4" font-family="'Segoe UI',Arial,sans-serif" font-size="15">Any phone. No app install. Join the softAP and open 192.168.4.1.</text>
    <text x="1136" y="56" fill="#98a5ff" text-anchor="end" font-family="ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="14">index.html · style.css · app.js (SPIFFS)</text>
  </g>

  <line x1="700" y1="220" x2="700" y2="248" stroke="#7c8cff" stroke-width="2" marker-start="url(#aup)" marker-end="url(#adn)"/>

  <!-- layer 2: API -->
  <g transform="translate(120,252)">
    <rect width="1160" height="128" rx="16" fill="#0d0f14" stroke="#2b3240"/>
    <rect x="0" y="0" width="4" height="128" rx="2" fill="#98a5ff"/>
    <text x="28" y="38" fill="#e9ecf3" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700">JSON API over HTTP</text>
    <g font-family="ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="13">
      <rect x="28" y="58" width="140" height="42" rx="9" fill="#12151c" stroke="#2b3240"/><text x="98" y="84" fill="#98a5ff" text-anchor="middle">/api/status</text>
      <rect x="180" y="58" width="140" height="42" rx="9" fill="#12151c" stroke="#2b3240"/><text x="250" y="84" fill="#98a5ff" text-anchor="middle">/api/action</text>
      <rect x="332" y="58" width="130" height="42" rx="9" fill="#12151c" stroke="#2b3240"/><text x="397" y="84" fill="#98a5ff" text-anchor="middle">/api/scan</text>
      <rect x="474" y="58" width="150" height="42" rx="9" fill="#12151c" stroke="#2b3240"/><text x="549" y="84" fill="#98a5ff" text-anchor="middle">/api/script</text>
      <rect x="636" y="58" width="190" height="42" rx="9" fill="#12151c" stroke="#2b3240"/><text x="731" y="84" fill="#98a5ff" text-anchor="middle">/api/capabilities</text>
      <rect x="838" y="58" width="160" height="42" rx="9" fill="#12151c" stroke="#2b3240"/><text x="918" y="84" fill="#98a5ff" text-anchor="middle">/api/settings</text>
      <rect x="1010" y="58" width="122" height="42" rx="9" fill="#12151c" stroke="#2b3240"/><text x="1071" y="84" fill="#98a5ff" text-anchor="middle">captures</text>
    </g>
  </g>

  <line x1="700" y1="384" x2="700" y2="412" stroke="#7c8cff" stroke-width="2" marker-start="url(#aup)" marker-end="url(#adn)"/>

  <!-- layer 3: core -->
  <g transform="translate(120,416)">
    <rect width="1160" height="128" rx="16" fill="#0d0f14" stroke="#2b3240"/>
    <rect x="0" y="0" width="4" height="128" rx="2" fill="#34d399"/>
    <text x="28" y="38" fill="#e9ecf3" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700">Execution core</text>
    <g font-family="'Segoe UI',Arial,sans-serif" font-size="14">
      <rect x="28" y="58" width="176" height="42" rx="9" fill="#12151c" stroke="#2b3240"/><text x="116" y="84" fill="#e9ecf3" text-anchor="middle">module registry</text>
      <rect x="216" y="58" width="170" height="42" rx="9" fill="#12151c" stroke="#2b3240"/><text x="301" y="84" fill="#e9ecf3" text-anchor="middle">actions engine</text>
      <rect x="398" y="58" width="160" height="42" rx="9" fill="#12151c" stroke="#2b3240"/><text x="478" y="84" fill="#e9ecf3" text-anchor="middle">script engine</text>
      <rect x="570" y="58" width="160" height="42" rx="9" fill="#12151c" stroke="#2b3240"/><text x="650" y="84" fill="#e9ecf3" text-anchor="middle">settings (NVS)</text>
      <rect x="742" y="58" width="150" height="42" rx="9" fill="#12151c" stroke="#2b3240"/><text x="817" y="84" fill="#e9ecf3" text-anchor="middle">power policy</text>
      <rect x="904" y="58" width="228" height="42" rx="9" fill="rgba(52,211,153,0.10)" stroke="rgba(52,211,153,0.4)"/><text x="1018" y="84" fill="#34d399" text-anchor="middle">harvest: EAPOL + PMKID (pure)</text>
    </g>
  </g>

  <line x1="700" y1="548" x2="700" y2="576" stroke="#7c8cff" stroke-width="2" marker-start="url(#aup)" marker-end="url(#adn)"/>

  <!-- layer 4: radio/io -->
  <g transform="translate(120,580)">
    <rect width="1160" height="150" rx="16" fill="#0d0f14" stroke="#2b3240"/>
    <rect x="0" y="0" width="4" height="150" rx="2" fill="#f0596b"/>
    <text x="28" y="38" fill="#e9ecf3" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700">Radio &amp; I/O</text>
    <g font-family="'Segoe UI',Arial,sans-serif" font-size="14">
      <rect x="28" y="58" width="220" height="72" rx="9" fill="#12151c" stroke="#2b3240"/>
      <text x="138" y="88" fill="#e9ecf3" text-anchor="middle">WiFi 6 · raw frames</text>
      <text x="138" y="112" fill="#525a68" text-anchor="middle" font-size="12">esp_wifi_80211_tx · monitor</text>

      <rect x="260" y="58" width="200" height="72" rx="9" fill="#12151c" stroke="#2b3240"/>
      <text x="360" y="88" fill="#e9ecf3" text-anchor="middle">BLE 5 · NimBLE</text>
      <text x="360" y="112" fill="#525a68" text-anchor="middle" font-size="12">scan · advertising</text>

      <rect x="472" y="58" width="240" height="72" rx="9" fill="#12151c" stroke="#2b3240"/>
      <text x="592" y="88" fill="#e9ecf3" text-anchor="middle">GPIO</text>
      <text x="592" y="112" fill="#525a68" text-anchor="middle" font-size="12">LED · buzzer · motor · tilt</text>

      <rect x="724" y="58" width="180" height="72" rx="9" fill="#12151c" stroke="#2b3240"/>
      <text x="814" y="88" fill="#e9ecf3" text-anchor="middle">NVS</text>
      <text x="814" y="112" fill="#525a68" text-anchor="middle" font-size="12">settings blob</text>

      <rect x="916" y="58" width="216" height="72" rx="9" fill="#12151c" stroke="#2b3240"/>
      <text x="1024" y="88" fill="#e9ecf3" text-anchor="middle">SPIFFS</text>
      <text x="1024" y="112" fill="#525a68" text-anchor="middle" font-size="12">script.txt · web console</text>
    </g>
  </g>
</svg>
