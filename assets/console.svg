<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 840" width="1400" height="840" role="img" aria-label="The VeloBox phone console running on a phone">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b10"/>
      <stop offset="1" stop-color="#060709"/>
    </linearGradient>
    <radialGradient id="cglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c8cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="appbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1218"/>
      <stop offset="1" stop-color="#0d0f14"/>
    </linearGradient>
    <linearGradient id="statusbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgba(124,140,255,0.22)"/>
      <stop offset="1" stop-color="rgba(124,140,255,0.03)"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="840" rx="24" fill="url(#cbg)"/>
  <rect x="1" y="1" width="1398" height="838" rx="23" fill="none" stroke="#1c212b"/>
  <circle cx="360" cy="420" r="420" fill="url(#cglow)"/>

  <text x="60" y="70" fill="#e9ecf3" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="700">The console</text>
  <text x="60" y="102" fill="#8a93a4" font-family="'Segoe UI',Arial,sans-serif" font-size="18">Served straight from the device at 192.168.4.1. Install nothing.</text>

  <!-- phone -->
  <g transform="translate(70,140)">
    <rect width="440" height="660" rx="40" fill="#050608" stroke="#2b3240" stroke-width="2"/>
    <rect x="12" y="12" width="416" height="636" rx="30" fill="#07080a"/>

    <!-- appbar -->
    <g transform="translate(12,12)">
      <rect width="416" height="64" rx="30" fill="url(#appbar)"/>
      <rect y="40" width="416" height="24" fill="url(#appbar)"/>
      <g transform="translate(30,32) scale(0.62) translate(-20 -20)">
        <g transform="rotate(-35 20 20)" fill="none" stroke="#7c8cff">
          <circle cx="20" cy="20" r="15.5" stroke-width="2.4" stroke-dasharray="72 25" opacity="0.5"/>
          <circle cx="20" cy="20" r="9.5" stroke-width="3" stroke-dasharray="44 16" opacity="0.95"/>
        </g>
        <circle cx="20" cy="20" r="3.4" fill="#98a5ff"/>
      </g>
      <text x="58" y="30" fill="#e9ecf3" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700">VeloBox</text>
      <text x="58" y="48" fill="#8a93a4" font-family="'Segoe UI',Arial,sans-serif" font-size="11">Wireless Assessment Console</text>
      <rect x="336" y="22" width="62" height="24" rx="12" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.45)"/>
      <circle cx="350" cy="34" r="4" fill="#34d399"/>
      <text x="361" y="39" fill="#34d399" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600">LIVE</text>
    </g>

    <!-- tabs -->
    <g transform="translate(12,76)">
      <rect width="416" height="40" fill="#0a0c11"/>
      <text x="34" y="26" fill="#e9ecf3" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600">Control</text>
      <rect x="22" y="34" width="52" height="3" rx="1.5" fill="#7c8cff"/>
      <text x="120" y="26" fill="#8a93a4" font-family="'Segoe UI',Arial,sans-serif" font-size="13">Recon</text>
      <text x="196" y="26" fill="#8a93a4" font-family="'Segoe UI',Arial,sans-serif" font-size="13">Script</text>
      <text x="272" y="26" fill="#8a93a4" font-family="'Segoe UI',Arial,sans-serif" font-size="13">Settings</text>
      <line x1="0" y1="39.5" x2="416" y2="39.5" stroke="#1c212b"/>
    </g>

    <!-- current action card -->
    <g transform="translate(28,132)">
      <rect width="384" height="104" rx="14" fill="#12151c" stroke="#2b3240"/>
      <rect width="384" height="104" rx="14" fill="url(#statusbar)" opacity="0.5"/>
      <text x="20" y="28" fill="#525a68" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" letter-spacing="1.5" font-weight="600">CURRENT ACTION</text>
      <text x="20" y="62" fill="#e9ecf3" font-family="'Segoe UI',Arial,sans-serif" font-size="27" font-weight="700">WiFi Deauth</text>
      <rect x="278" y="16" width="88" height="26" rx="13" fill="rgba(240,89,107,0.12)" stroke="rgba(240,89,107,0.5)"/>
      <text x="322" y="33" fill="#f0596b" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700">RUNNING</text>
      <text x="20" y="88" fill="#8a93a4" font-family="'Segoe UI',Arial,sans-serif" font-size="13">Deauth frames 1421 · Step 3 of 5</text>
    </g>

    <!-- stats -->
    <g transform="translate(28,252)" font-family="'Segoe UI',Arial,sans-serif">
      <g>
        <rect width="184" height="66" rx="12" fill="#0f1218" stroke="#1c212b"/>
        <text x="16" y="26" fill="#8a93a4" font-size="11" letter-spacing="1">DEAUTHS</text>
        <text x="16" y="54" fill="#e9ecf3" font-size="26" font-weight="700">1421</text>
      </g>
      <g transform="translate(200,0)">
        <rect width="184" height="66" rx="12" fill="#0f1218" stroke="#1c212b"/>
        <text x="16" y="26" fill="#8a93a4" font-size="11" letter-spacing="1">HANDSHAKES</text>
        <text x="16" y="54" fill="#34d399" font-size="26" font-weight="700">2</text>
      </g>
      <g transform="translate(0,82)">
        <rect width="184" height="66" rx="12" fill="#0f1218" stroke="#1c212b"/>
        <text x="16" y="26" fill="#8a93a4" font-size="11" letter-spacing="1">PROBES</text>
        <text x="16" y="54" fill="#e9ecf3" font-size="26" font-weight="700">5</text>
      </g>
      <g transform="translate(200,82)">
        <rect width="184" height="66" rx="12" fill="#0f1218" stroke="#1c212b"/>
        <text x="16" y="26" fill="#8a93a4" font-size="11" letter-spacing="1">BEACONS</text>
        <text x="16" y="54" fill="#e9ecf3" font-size="26" font-weight="700">0</text>
      </g>
    </g>

    <!-- OPERATIONS -->
    <text x="28" y="452" fill="#525a68" font-family="'Segoe UI',Arial,sans-serif" font-size="11" letter-spacing="2" font-weight="700">OPERATIONS</text>
    <g transform="translate(28,464)">
      <g>
        <rect width="120" height="80" rx="12" fill="rgba(240,89,107,0.08)" stroke="rgba(240,89,107,0.5)"/>
        <text x="60" y="40" fill="#ff8f9c" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700">WiFi Deauth</text>
        <text x="60" y="60" fill="#8a93a4" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5">802.11 flood</text>
      </g>
      <g transform="translate(132,0)">
        <rect width="120" height="80" rx="12" fill="#12151c" stroke="#2b3240"/>
        <text x="60" y="40" fill="#e9ecf3" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700">BLE Spam</text>
        <text x="60" y="60" fill="#8a93a4" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5">Advertising</text>
      </g>
      <g transform="translate(264,0)">
        <rect width="120" height="80" rx="12" fill="#12151c" stroke="#2b3240"/>
        <text x="60" y="40" fill="#e9ecf3" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700">Fake AP</text>
        <text x="60" y="60" fill="#8a93a4" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5">Beacon flood</text>
      </g>
    </g>

    <!-- RECON -->
    <text x="28" y="572" fill="#525a68" font-family="'Segoe UI',Arial,sans-serif" font-size="11" letter-spacing="2" font-weight="700">RECON</text>
    <g transform="translate(28,584)">
      <g>
        <rect width="120" height="80" rx="12" fill="#12151c" stroke="#2b3240"/>
        <text x="60" y="40" fill="#e9ecf3" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700">WiFi Scan</text>
        <text x="60" y="60" fill="#8a93a4" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5">AP + clients</text>
      </g>
      <g transform="translate(132,0)">
        <rect width="120" height="80" rx="12" fill="#12151c" stroke="#2b3240"/>
        <text x="60" y="40" fill="#e9ecf3" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700">BLE Scan</text>
        <text x="60" y="60" fill="#8a93a4" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5">GAP discovery</text>
      </g>
      <g transform="translate(264,0)">
        <rect width="120" height="80" rx="12" fill="#12151c" stroke="#2b3240"/>
        <text x="60" y="40" fill="#e9ecf3" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700">Probe Flood</text>
        <text x="60" y="60" fill="#8a93a4" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5">Probe inject</text>
      </g>
    </g>

    <text x="220" y="692" fill="#525a68" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11">Roll the ball to arm — one buzz deauth, two BLE, three fake AP</text>
  </g>

  <!-- callouts -->
  <g font-family="'Segoe UI',Arial,sans-serif">
    <g transform="translate(620,220)">
      <rect width="700" height="96" rx="14" fill="#0d0f14" stroke="#1c212b"/>
      <rect x="0" y="0" width="4" height="96" rx="2" fill="#7c8cff"/>
      <text x="30" y="40" fill="#e9ecf3" font-size="20" font-weight="700">Buttons built from the firmware</text>
      <text x="30" y="68" fill="#8a93a4" font-size="15">Every tile is generated from the module registry. Add a tool in one line and it appears here — no HTML or JS edits.</text>
    </g>
    <g transform="translate(620,340)">
      <rect width="700" height="96" rx="14" fill="#0d0f14" stroke="#1c212b"/>
      <rect x="0" y="0" width="4" height="96" rx="2" fill="#f0596b"/>
      <text x="30" y="40" fill="#e9ecf3" font-size="20" font-weight="700">Destructive actions look like it</text>
      <text x="30" y="68" fill="#8a93a4" font-size="15">Attacks get the red treatment. Passive recon stays neutral. You never mis-tap on a live engagement.</text>
    </g>
    <g transform="translate(620,460)">
      <rect width="700" height="96" rx="14" fill="#0d0f14" stroke="#1c212b"/>
      <rect x="0" y="0" width="4" height="96" rx="2" fill="#34d399"/>
      <text x="30" y="40" fill="#e9ecf3" font-size="20" font-weight="700">Live state, zero refresh</text>
      <text x="30" y="68" fill="#8a93a4" font-size="15">Counters, captures and the running script step stream from /api/status. The console is never stale.</text>
    </g>
    <g transform="translate(620,580)">
      <rect width="700" height="130" rx="14" fill="#0d0f14" stroke="#1c212b"/>
      <rect x="0" y="0" width="4" height="130" rx="2" fill="#7c8cff"/>
      <text x="30" y="40" fill="#e9ecf3" font-size="20" font-weight="700">Your whole op, scripted</text>
      <text x="30" y="68" fill="#8a93a4" font-size="15">Chain steps in plain text and run them from the phone:</text>
      <text x="30" y="98" fill="#98a5ff" font-family="ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="14">recon 15000 · deauth aa:bb:cc:dd:ee:ff 5000 · wait 1000 · probe 8000</text>
    </g>
  </g>
</svg>
